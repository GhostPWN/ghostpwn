name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  version:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest and formula versions
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          formula_version="$(sed -n 's/.*version "\(.*\)"/\1/p' Formula/ghostpwn.rb)"
          test "$cargo_version" = "$formula_version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "v$cargo_version" = "$GITHUB_REF_NAME"
          fi

  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Test bundled security scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m compileall -q src/skills
          python3 src/tests/security_scripts.py

      - name: Build release
        run: cargo build --release

      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path target/release/ghostpwn.exe -DestinationPath dist/ghostpwn-windows-x86_64.zip

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ghostpwn-windows-x86_64
          path: dist/ghostpwn-windows-x86_64.zip

  web:
    name: Validate website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

[package]
name = "ghostpwn"
version = "0.2.1"
edition = "2024"
description = "Autonomous pentest agent TUI with multi-provider LLM support"
license = "MIT"
homepage = "https://ghostpwn.vercel.app/"
repository = "https://github.com/GhostPWN/ghostpwn"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.22.1"
crossterm = "0.29.0"
futures-util = "0.3.31"
globset = "0.4.16"
keyring = "3.6.3"
rand = "0.9.2"
ratatui = "0.29.0"
regex = "1.11.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["full"] }
url = "2.5.7"
walkdir = "2.5.0"
webbrowser = "1.0.6"

[dev-dependencies]
tempfile = "3.23.0"

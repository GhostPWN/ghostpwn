[package]
name = "ghostpwn"
version = "0.1.4"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
crossterm = "0.29.0"
futures-util = "0.3.31"
globset = "0.4.16"
keyring = "3.6.3"
ratatui = "0.29.0"
regex = "1.11.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
unicode-width = "0.2.0"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.23.0"

[package]
name = "ghostpwn"
version = "0.2.10"
edition = "2024"
description = "Autonomous pentest agent TUI with multi-provider LLM support"
license = "MIT"
homepage = "https://ghostpwn.vercel.app/"
repository = "https://github.com/GhostPWN/ghostpwn"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
base64 = "0.22.1"
crossterm = "0.29.0"
command-group = { version = "5.0.1", default-features = false, features = ["with-tokio"] }
futures-util = "0.3.33"
globset = "0.4.19"
include_dir = "0.7.4"
keyring = "3.6.3"
rand = "0.9.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
walkdir = "2.5.0"
webbrowser = "1.2.2"

[dev-dependencies]
tempfile = "3.27.0"
